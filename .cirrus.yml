macos_instance:
  image: ghcr.io/cirruslabs/macos-runner:tahoe # macOS 26 Tahoe

task:
  name: "VNC Remote Desktop Session"
  timeout_in: 120m # Gives you 2 hours of access
  
  env:
    # If this fails, generate a new one in Tailscale and replace it here.
    TS_KEY: "tskey-auth-kv6DYcRYtG11CNTRL-F6kTuoaFabiHSmUUtEjVbiYMNAm2xgaf"
    VNC_PASSWORD: "admin"

  setup_vnc_and_tailscale_script:
    - |
      # 1. Install & Start Tailscale
      curl -fsSL https://tailscale.com/install.sh | sh
      sudo tailscaled --tun=userspace-networking &
      sleep 5
      sudo tailscale up --authkey=$TS_KEY --hostname=cirrus-vnc-mac --accept-routes
      
      # 2. Enable macOS Screen Sharing (VNC)
      # Set the password for the 'admin' or 'cirrus' user
      echo "$VNC_PASSWORD" | sudo /usr/bin/dscl . -passwd /Users/cirrus
      
      # Activate Remote Management
      sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
      -activate -configure -access -on \
      -clientopts -setvncpassword -vncpasswd "$VNC_PASSWORD" \
      -restart -agent -privs -all
      
      echo "VNC is now active at the Tailscale IP of this machine."
      tailscale ip -4

  wait_for_connection_script:
    - |
      echo "Runner is staying alive for 2 hours. Connect now!"
      # This loop prevents the task from finishing/closing
      sleep 7200
